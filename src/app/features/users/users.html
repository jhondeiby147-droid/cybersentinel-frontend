<div class="flex min-h-screen bg-cyber-dark">
    <app-sidebar></app-sidebar>

    <main class="flex-1 p-4 md:p-8 lg:p-12 overflow-y-auto">
        <br><br><br>

        <header class="mb-10">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Gestión de <span
                    class="text-cyber-accent">Usuarios</span></h1>
            <p class="text-slate-400">Administre las cuentas y roles de acceso al sistema.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

            <!-- Formulario Dinámico (Crear / Editar) -->
            <section class="lg:col-span-1">
                <div class="glass-panel p-8 sticky top-8">
                    <h2 class="text-xl font-bold text-white mb-6 flex items-center transition-all">
                        <span class="w-2 h-6 bg-cyber-accent rounded-full mr-3"
                            [class.bg-yellow-400]="editingUserId"></span>
                        {{ editingUserId ? 'Editar Usuario' : 'Nuevo Usuario' }}
                    </h2>

                    <!-- Cambiamos (ngSubmit) por submitForm() -->
                    <form [formGroup]="userForm" (ngSubmit)="submitForm()" class="flex flex-col space-y-5">

                        <div class="flex flex-col space-y-2">
                            <label class="text-xs font-bold text-slate-400 uppercase">Nombre de Usuario</label>
                            <input type="text" formControlName="username" class="form-control transition-all"
                                [class.opacity-50]="editingUserId" [class.cursor-not-allowed]="editingUserId"
                                placeholder="Ej: j_godoy">
                        </div>

                        <div class="flex flex-col space-y-2">
                            <label class="text-xs font-bold text-slate-400 uppercase flex justify-between">
                                Contraseña
                                <span *ngIf="editingUserId"
                                    class="text-[9px] text-yellow-500/80 normal-case">(Opcional)</span>
                            </label>
                            <input type="password" formControlName="password" class="form-control"
                                [placeholder]="editingUserId ? 'Dejar en blanco para conservar actual' : '••••••••'">
                        </div>

                        <div class="flex flex-col space-y-2">
                            <label class="text-xs font-bold text-slate-400 uppercase">Rol Asignado</label>
                            <select formControlName="role" class="form-control appearance-none">
                                <option value="Analista">Analista</option>
                                <option value="Gerente">Gerente</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-2 pt-4">
                            <button type="submit" [disabled]="isSubmitting" class="btn-primary w-full transition-all"
                                [class.bg-yellow-500]="editingUserId" [class.hover:bg-yellow-400]="editingUserId">
                                <span *ngIf="!isSubmitting">{{ editingUserId ? 'Guardar Cambios' : 'Registrar Usuario'
                                    }}</span>
                                <span *ngIf="isSubmitting" class="animate-pulse">Procesando...</span>
                            </button>

                            <!-- Botón para cancelar la edición y volver a modo creación -->
                            <button type="button" *ngIf="editingUserId" (click)="cancelEdit()"
                                class="w-full py-2 text-xs font-bold text-slate-400 hover:text-white uppercase tracking-widest transition-colors">
                                Cancelar Edición
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Listado de Usuarios -->
            <section class="lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-white flex items-center">
                        <span class="w-2 h-6 bg-sev-medium rounded-full mr-3"></span>
                        Directorio de Personal
                    </h2>

                    <button (click)="loadUsers()"
                        class="flex items-center gap-2 px-3 py-1.5 text-xs font-bold text-slate-400 hover:text-white border border-white/10 hover:border-white/20 rounded-lg transition-all bg-white/5">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-3.5 h-3.5" [class.animate-spin]="isLoading">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                        SINCRONIZAR
                    </button>
                </div>
                <div *ngIf="isLoading" class="flex justify-center py-20">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-cyber-accent"></div>
                </div>

                <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div *ngFor="let u of users"
                        class="glass-panel p-5 border border-white/5 hover:border-cyber-accent/30 transition-all group"
                        [class.border-yellow-500]="editingUserId === u.id">

                        <div class="flex justify-between items-start">
                            <div class="flex items-center">
                                <div class="w-12 h-12 rounded-full flex items-center justify-center font-black text-xl border transition-colors"
                                    [ngClass]="editingUserId === u.id ? 'bg-yellow-500/20 text-yellow-500 border-yellow-500/30' : 'bg-slate-800 text-cyber-accent border-white/10'">
                                    {{ u.username.charAt(0).toUpperCase() }}
                                </div>
                                <div class="ml-4">
                                    <h3 class="text-white font-bold">{{ u.username }}</h3>
                                    <span
                                        [class]="'text-[10px] px-2 py-0.5 rounded border font-bold uppercase ' + getRoleClass(u.role)">
                                        {{ u.role }}
                                    </span>
                                </div>
                            </div>

                            <button (click)="deleteUser(u.id)"
                                class="text-slate-600 hover:text-sev-critical p-2 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>

                        <div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center">
                            <span class="text-[10px] text-slate-500 font-mono italic">ID: #00{{ u.id }}</span>

                            <!-- ¡Botón conectado a la función setEditMode! -->
                            <button (click)="setEditMode(u)"
                                class="text-[10px] text-cyber-accent hover:underline font-bold uppercase tracking-widest transition-colors"
                                [class.text-yellow-500]="editingUserId === u.id">
                                {{ editingUserId === u.id ? 'Editando...' : 'Editar Perfil' }}
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div *ngIf="!isLoading && users.length === 0"
                    class="glass-panel p-20 text-center border-dashed border-white/10">
                    <p class="text-slate-500 italic">No hay usuarios registrados en el sistema.</p>
                </div>
            </section>

        </div>
    </main>
</div>
